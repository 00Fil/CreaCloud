# Server unico senza Dokploy (es. VPS in UE): i servizi di ../docker-compose.yml più Caddy per HTTPS.
# Uso, dalla cartella principale del repository:
#   cp .env.example .env   # e compila i valori
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
name: creacloud

include:
  - ../docker-compose.yml

services:
  caddy:
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?manca DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped
    depends_on: [web]

volumes:
  caddy-data:
