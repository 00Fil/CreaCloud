name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/engine/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # il test di contratto lancia il motore Python
      - run: pip install -r ../../services/engine/requirements.txt
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/whatsapp-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/whatsapp-gateway/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      # applica migrazioni e dati di esempio su un Postgres Supabase reale
      - run: supabase start -x studio,mailpit,imgproxy,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime
